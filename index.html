<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Message for Erica 💖</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe0f0 0%, #ffd6e8 30%, #e8d5f5 60%, #d5e8ff 100%);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .float-msg {
    position: fixed;
    white-space: nowrap;
    font-size: clamp(12px, 2vw, 16px);
    font-weight: 600;
    pointer-events: none;
    animation: floatAcross linear infinite;
    text-shadow: 0 1px 3px rgba(255,255,255,0.6);
  }
  @keyframes floatAcross {
    from { transform: translateX(-110vw); }
    to   { transform: translateX(110vw); }
  }
  #hint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  #hint .paw { font-size: 64px; animation: pulse 1.5s ease-in-out infinite; }
  #hint p { margin-top: 14px; font-size: 22px; color: #c060a0; font-weight: 700; }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: .9; }
    50%      { transform: scale(1.2); opacity: 1; }
  }
  #cat-stage {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    text-align: center;
    pointer-events: none;
  }
  #cat-stage.show { animation: bounceIn 0.7s cubic-bezier(.36,1.56,.64,1) forwards; }
  @keyframes bounceIn {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(-10deg); }
    60%  { transform: translate(-50%,-50%) scale(1.15) rotate(3deg); }
    80%  { transform: translate(-50%,-50%) scale(0.95) rotate(-2deg); }
    100% { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
  }
  #cat-stage.wiggle { animation: wiggle 2.5s ease-in-out infinite; }
  @keyframes wiggle {
    0%,100% { transform: translate(-50%,-50%) rotate(0deg) scale(1); }
    20%     { transform: translate(-50%,-50%) rotate(-3deg) scale(1.03); }
    40%     { transform: translate(-50%,-50%) rotate(3deg) scale(1.03); }
    60%     { transform: translate(-50%,-50%) rotate(-2deg) scale(1.01); }
    80%     { transform: translate(-50%,-50%) rotate(2deg) scale(1.01); }
  }
  #cat-svg { width: clamp(180px, 40vw, 280px); display: block; margin: 0 auto; }
  #bubble {
    position: relative;
    background: #fff;
    border: 3px solid #e880b8;
    border-radius: 20px;
    padding: 14px 22px;
    margin: 0 auto 8px;
    max-width: 320px;
    box-shadow: 0 6px 24px rgba(220,100,180,0.25);
    opacity: 0;
    transition: opacity 0.4s 0.5s;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: '';
    position: absolute;
    bottom: -18px; left: 50%;
    transform: translateX(-50%);
    border: 9px solid transparent;
    border-top-color: #e880b8;
  }
  #bubble::before {
    content: '';
    position: absolute;
    bottom: -13px; left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #fff;
    z-index: 1;
  }
  #bubble p { font-size: clamp(14px,3vw,18px); color: #b03080; font-weight: 700; line-height: 1.6; text-align: center; }
  .heart { position: fixed; pointer-events: none; animation: floatHeart 3s ease-out forwards; z-index: 10; }
  @keyframes floatHeart {
    0%   { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-80vh) scale(1.4) rotate(20deg); opacity: 0; }
  }
  .confetti { position: fixed; border-radius: 2px; pointer-events: none; animation: confettiFall linear forwards; z-index: 9; }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  #signature {
    position: fixed; bottom: 14px; right: 18px;
    font-size: 13px; color: rgba(160,60,120,0.7);
    font-style: italic; font-weight: 600;
    pointer-events: none; z-index: 20;
  }
  #msg2 {
    margin-top: 22px;
    font-size: clamp(16px,4vw,22px);
    color: #c0408a; font-weight: 800;
    text-align: center;
    text-shadow: 0 2px 8px rgba(255,180,220,0.7);
    opacity: 0; transition: opacity 0.5s 1.1s;
  }
  #msg2.show { opacity: 1; }
</style>
</head>
<body>

<div id="hint">
  <div class="paw">🐾</div>
  <p>Click anywhere for a surprise! 🌸</p>
</div>

<div id="cat-stage">
  <div id="bubble">
    <p>Hello beautiful! Meow meow 😺<br>You are my princess Erica 💖</p>
  </div>
  <svg id="cat-svg" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="110" cy="200" rx="58" ry="50" fill="#ffccee" stroke="#e880b8" stroke-width="2.5"/>
    <ellipse cx="110" cy="210" rx="32" ry="30" fill="#fff0f8"/>
    <path d="M168 230 Q210 200 195 160 Q185 145 175 160" fill="none" stroke="#e880b8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="110" cy="130" r="52" fill="#ffccee" stroke="#e880b8" stroke-width="2.5"/>
    <polygon points="68,90 58,55 90,82" fill="#ffccee" stroke="#e880b8" stroke-width="2"/>
    <polygon points="70,87 63,63 88,82" fill="#ffb3d9"/>
    <polygon points="152,90 162,55 130,82" fill="#ffccee" stroke="#e880b8" stroke-width="2"/>
    <polygon points="150,87 157,63 132,82" fill="#ffb3d9"/>
    <ellipse cx="92" cy="125" rx="10" ry="11" fill="#fff"/>
    <ellipse cx="128" cy="125" rx="10" ry="11" fill="#fff"/>
    <ellipse cx="93" cy="126" rx="6" ry="7" fill="#3d1a3d"/>
    <ellipse cx="129" cy="126" rx="6" ry="7" fill="#3d1a3d"/>
    <circle cx="95" cy="123" r="2" fill="#fff"/>
    <circle cx="131" cy="123" r="2" fill="#fff"/>
    <ellipse cx="82" cy="140" rx="10" ry="6" fill="#ffaacc" opacity="0.6"/>
    <ellipse cx="138" cy="140" rx="10" ry="6" fill="#ffaacc" opacity="0.6"/>
    <polygon points="110,142 106,148 114,148" fill="#ff80b3"/>
    <path d="M106,148 Q110,154 114,148" fill="none" stroke="#e860a8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="60" y1="143" x2="100" y2="145" stroke="#c06090" stroke-width="1.5" opacity="0.7"/>
    <line x1="58" y1="150" x2="100" y2="149" stroke="#c06090" stroke-width="1.5" opacity="0.7"/>
    <line x1="160" y1="143" x2="120" y2="145" stroke="#c06090" stroke-width="1.5" opacity="0.7"/>
    <line x1="162" y1="150" x2="120" y2="149" stroke="#c06090" stroke-width="1.5" opacity="0.7"/>
    <path d="M60 195 Q30 175 25 155" fill="none" stroke="#e880b8" stroke-width="12" stroke-linecap="round"/>
    <path d="M160 195 Q190 175 195 155" fill="none" stroke="#e880b8" stroke-width="12" stroke-linecap="round"/>
    <line x1="195" y1="155" x2="210" y2="100" stroke="#6abf69" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="202" cy="130" rx="10" ry="5" fill="#81c784" transform="rotate(-30 202 130)"/>
    <ellipse cx="208" cy="118" rx="9" ry="4" fill="#66bb6a" transform="rotate(20 208 118)"/>
    <circle cx="210" cy="92" r="10" fill="#ff80ab"/>
    <circle cx="220" cy="80" r="8" fill="#ff4081"/>
    <circle cx="200" cy="82" r="9" fill="#ff80ab"/>
    <circle cx="215" cy="68" r="7" fill="#f48fb1"/>
    <circle cx="210" cy="92" r="4" fill="#fff176"/>
    <circle cx="220" cy="80" r="3.5" fill="#fff176"/>
    <circle cx="200" cy="82" r="4" fill="#fff176"/>
    <circle cx="215" cy="68" r="3" fill="#fff176"/>
    <path d="M205 130 Q210 140 215 130" fill="none" stroke="#ff4081" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="25" cy="157" rx="12" ry="9" fill="#ffccee" stroke="#e880b8" stroke-width="1.5"/>
    <ellipse cx="195" cy="157" rx="12" ry="9" fill="#ffccee" stroke="#e880b8" stroke-width="1.5"/>
    <polygon points="95,175 110,182 95,189" fill="#ff4081"/>
    <polygon points="125,175 110,182 125,189" fill="#ff4081"/>
    <circle cx="110" cy="182" r="5" fill="#ff80ab"/>
    <ellipse cx="110" cy="84" rx="42" ry="8" fill="#e040fb" opacity="0.85"/>
    <rect x="82" y="42" width="56" height="43" rx="10" fill="#e040fb" opacity="0.85"/>
    <ellipse cx="110" cy="42" rx="28" ry="7" fill="#ce25f5" opacity="0.9"/>
    <rect x="82" y="72" width="56" height="8" fill="#ff4081" opacity="0.8"/>
    <text x="110" y="66" font-size="18" fill="#fff176" text-anchor="middle">⭐</text>
  </svg>
  <div id="msg2">✨ You are my princess Erica 💖 ✨</div>
</div>

<div id="signature">Made with love by Erkan 💕</div>

<script>
  const quotes = [
    "💖 You are amazing!", "🌸 Stay beautiful!", "✨ You light up my world!",
    "🐱 Meow with love!", "🌷 Every day is better with you!", "💫 You are one in a million!",
    "🌈 Your smile is sunshine!", "🎀 So cute, so sweet!", "💝 Born to be loved!",
    "🌺 You make hearts bloom!", "🍀 Lucky to know you!", "🦋 Beautiful inside & out!",
    "💌 Love letters for you!", "🎵 You're my favourite song!", "🌙 My shining star!"
  ];
  const colors = ['#e880b8','#c060a0','#a040d0','#e84090','#8060c0','#d060b0'];

  function spawnQuote() {
    const el = document.createElement('div');
    el.className = 'float-msg';
    el.textContent = quotes[Math.floor(Math.random() * quotes.length)];
    const top = Math.random() * 90;
    const dur = 9 + Math.random() * 10;
    el.style.cssText = `top:${top}vh; color:${colors[Math.floor(Math.random()*colors.length)]}99;
      animation-duration:${dur}s; animation-delay:-${Math.random()*dur}s;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + 2) * 1000);
  }
  for (let i = 0; i < 18; i++) setTimeout(spawnQuote, i * 600);
  setInterval(spawnQuote, 2800);

  function spawnHeart(x, y) {
    const hearts = ['💖','💗','💕','💝','🌸','✨','🌷','😺'];
    for (let i = 0; i < 8; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.cssText = `left:${x + (Math.random()-0.5)*120}px; top:${y}px;
        font-size:${16+Math.random()*20}px;
        animation-duration:${2+Math.random()*2}s;
        animation-delay:${Math.random()*0.4}s;`;
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 4500);
    }
  }

  function spawnConfetti() {
    const cols = ['#ff80ab','#e040fb','#40c4ff','#69f0ae','#fff176','#ff6e40'];
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.cssText = `left:${Math.random()*100}vw; top:-20px;
        background:${cols[Math.floor(Math.random()*cols.length)]};
        width:${6+Math.random()*10}px; height:${6+Math.random()*10}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        animation-duration:${2.5+Math.random()*2.5}s;
        animation-delay:${Math.random()*1.5}s;`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5500);
    }
  }

  let revealed = false;
  document.body.addEventListener('click', function(e) {
    if (!revealed) {
      const hint = document.getElementById('hint');
      const stage = document.getElementById('cat-stage');
      const bubble = document.getElementById('bubble');
      const msg2 = document.getElementById('msg2');
      hint.style.opacity = '0';
      setTimeout(() => hint.style.display = 'none', 500);
      stage.classList.add('show');
      setTimeout(() => { stage.classList.remove('show'); stage.classList.add('wiggle'); }, 900);
      setTimeout(() => bubble.classList.add('show'), 600);
      setTimeout(() => msg2.classList.add('show'), 1200);
      spawnConfetti();
      revealed = true;
    }
    spawnHeart(e.clientX, e.clientY);
  });
</script>
</body>
</html>
